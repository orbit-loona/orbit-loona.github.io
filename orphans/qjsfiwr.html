		<style>
			#description {
				line-height: 110%;
			}

			#date {
				border: 1px solid #ccc;
				padding: 1px;
			}
			
			#main {
				border: 1px solid white;
				image-rendering: pixelated;
			}
			
			#codeinput1, #codeinput2 {
				min-width: 400px;
				min-height: 100px;
				font-family: monospace;
				line-height: 110%;
				font-size: 70%;
			}
		</style>
		<script>
			//dimension cache
			window.dc = {w: 100, h: 100, ox: 0, oy: 0}

			function updateSize() {
				let destination = document.getElementById('main');
				let widthInput = document.getElementById('width');
				let heightInput = document.getElementById('height');
				let scaleInput = document.getElementById('scale');
				if(destination && widthInput && heightInput) {
					let win = widthInput.value ?? '1'; let hin = heightInput.value ?? '1'; let mulIn = scaleInput.value ?? '1';
					if(isNaN(win)) { win = '1' }; if(isNaN(hin)) { hin = '1' }; if(isNaN(mulIn)) { mulIn = '1' };
					let width = Math.max(1,Math.min(10000,Math.round(Number(win))));
					let height = Math.max(1,Math.min(10000,Math.round(Number(hin))));
					let scale = Math.max(1,Math.min(15,Math.round(Number(mulIn))));
					window.dc.w = width; window.dc.h = height;
					destination.setAttribute('width',width + 'px'); destination.setAttribute('height',height + 'px');
					destination.style.width = (width * scale) + 'px'; destination.style.height = (height * scale) + 'px';
				};
			}

			function updateOffset() {
				let oxInput = document.getElementById('xoffset');
				let oyInput = document.getElementById('yoffset');
				if(oxInput && oyInput) {
					let win = oxInput.value ?? '0'; let hin = oyInput.value ?? '0';
					if(isNaN(win)) { win = '0' }; if(isNaN(hin)) { hin = '0' };
					let right = Math.max(Number.MIN_SAFE_INTEGER,Math.min(Number.MAX_SAFE_INTEGER,Math.round(Number(win))));
					let up = Math.max(Number.MIN_SAFE_INTEGER,Math.min(Number.MAX_SAFE_INTEGER,Math.round(Number(hin))));
					window.dc.ox = right; window.dc.oy = up;
				}
			}
		</script>
	</head>
	<body>
		<h1>Template</h1>
		<p id="description">This page is just a skeleton. It is meant to be copied, and these copies edited into other pages on this site.<br/>
		This is where a second point goes. This page was loaded at <span id="date">an uncalculated time. (Is JavaScript enabled?)</span>.</p><br/>
		<p><input type="number" min="1" max="10000" value="32" id="width" placeholder="Width"></input> &nbsp; <input type="number" min="1" max="10000" value="32" id="height" placeholder="Height"></input> &nbsp; <input type="number" min="1" max="15" value="5" id="scale" placeholder="Scale"></input><br>
		<input type="number" min="-9007199254740991" max="9007199254740991" value="0" id="xoffset" placeholder="X offset"></input> &nbsp; <input type="number" min="-9007199254740991" max="9007199254740991" value="0" id="yoffset" placeholder="Y offset"></input></p>
		<div><canvas id="main" width="32" height="32" style="width: 160px; height: 160px;"></canvas></div>
		<div><textarea id="codeinput1" placeholder="Per pixel, must take (tx,ty) and return a color. It has to be an arrow function or you get 'function statements require a function name'."></textarea></div>
		<div><textarea id="codeinput2" placeholder="To operate on the canvas directly. The context is called 'context'."></textarea></div>
		<button id="renderbutton">Render</button>

		<script>
			canvas = document.getElementById('main');
			context = canvas.getContext('2d');
			
			console.log("Body-dependent code goes here (if any)")
			var dateText = document.getElementById("date");
			if(dateText) { dateText.innerText = new Date().toLocaleString() }

			function shuffle(array) {
			  for (let i = array.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[array[i], array[j]] = [array[j], array[i]]; // Swap elements
			  }
			  return array;
			}
			
			colorerHolder = {colorer: null, alternate: null}
			
			function getColorer() {
				let codeGiven = document.getElementById('codeinput1')?.value ?? '';
				let result = null;
				try {
					result = eval(codeGiven)
				} catch(error) {
					//console.error(error);
					return false
				};
				if(typeof(result) == 'function') {
					colorerHolder.colorer = result;
					return true
				} else if(codeGiven == '') {
					colorerHolder.colorer = null;
				};
				return false
			}

			function getAlternateColorer() {
				let codeGiven = document.getElementById('codeinput2')?.value ?? '';
				let result = null;
				try {
					result = eval(codeGiven)
				} catch(error) {
					return false
				};
				if(typeof(result) == 'function') {
					colorerHolder.alternate = result;
					return true
				} else if(codeGiven == '') {
					colorerHolder.alternate = null;
				};
				return false
			}

			function main() {
				getColorer();
				getAlternateColorer();
				let use = 'colorer'
				if(! colorerHolder.colorer) {
					if(! colorerHolder.alternate) {
						return
					} else {
						use = 'alternate'
					}
				}
				console.log(use);
				context.fillStyle = '#000000';
				context.fillRect(0,0,window.dc.w,window.dc.h);
				let my = window.dc.h; let mx = window.dc.w;
				if(use == 'colorer') {
					for(let y = 0; y < my; y++) {
						for(let x = 0; x < mx; x++) {
							let tx = x + window.dc.ox;
							let ty = y + window.dc.oy;
							let color = colorerHolder.colorer(tx,ty);
							context.fillStyle = color;
							context.fillRect(x,y,1,1)
						}
					}
				} else if(use == 'alternate') {
					colorerHolder.alternate(window.dc.ox,window.dc.oy,window.dc.w,window.dc.h)
				}
			}

			let oxInput = document.getElementById('xoffset'); oxInput.addEventListener('input',function() { updateOffset(); main(); });
			let oyInput = document.getElementById('yoffset'); oyInput.addEventListener('input',function() { updateOffset(); main(); });
			let widthInput = document.getElementById('width'); widthInput.addEventListener('input',function() { updateSize(); main(); });
			let heightInput = document.getElementById('height'); heightInput.addEventListener('input',function() { updateSize(); main(); });
			let scaleInput = document.getElementById('scale'); scaleInput.addEventListener('input',function() { updateSize(); main(); });
			let codeInput1 = document.getElementById('codeinput1'); codeInput1.addEventListener('input',function() {
				let worked = getColorer(); if(worked) { main() }
			});
			let codeInput2 = document.getElementById('codeinput2'); codeInput2.addEventListener('input',function() {
				let worked = getColorer(); if(worked) { main() }
			});
			let renderButton = document.getElementById('renderbutton'); renderButton.addEventListener('click',function() { main() });
		</script>

	</body>
